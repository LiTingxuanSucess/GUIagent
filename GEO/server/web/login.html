<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>GEO Admin 登录</title>
  <style>
    :root {
      --bg: #0f1419; --panel: #1a222c; --line: #2e3a48; --text: #e7eef6;
      --muted: #8b9bb0; --accent: #3d9cf0; --bad: #e85d5d;
      --sans: "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh; display: grid; place-items: center;
      background: var(--bg); color: var(--text); font-family: var(--sans);
    }
    form {
      width: min(360px, 92vw); background: var(--panel); border: 1px solid var(--line);
      border-radius: 12px; padding: 22px;
    }
    h1 { margin: 0 0 6px; font-size: 18px; }
    p { margin: 0 0 16px; color: var(--muted); font-size: 13px; }
    label { display: block; font-size: 12px; color: var(--muted); margin: 10px 0 4px; }
    input, button {
      width: 100%; font: inherit; border-radius: 6px; border: 1px solid var(--line);
      background: #232d39; color: var(--text); padding: 9px 10px;
    }
    button { margin-top: 16px; background: #1e4d7a; border-color: #2a6aa8; cursor: pointer; }
    .err { color: var(--bad); font-size: 13px; min-height: 1.2em; margin-top: 8px; }
    .remember { display: flex; align-items: center; gap: 8px; margin-top: 12px; font-size: 13px; color: var(--muted); }
    .remember input { width: auto; }
  </style>
</head>
<body>
  <form id="f">
    <h1>GEO Admin</h1>
    <p>登录后管理六站会话，并查看抓取结果。</p>
    <label>用户名</label>
    <input name="user" autocomplete="username" value="admin" />
    <label>密码</label>
    <input name="password" type="password" autocomplete="current-password" />
    <label class="remember"><input id="remember" type="checkbox" /> 记住账号密码</label>
    <div class="err" id="err"></div>
    <button type="submit">登录</button>
  </form>
  <script>
    const requestedNext = new URLSearchParams(location.search).get("next") || "/";
    const next = requestedNext.startsWith("/") && !requestedNext.startsWith("//") ? requestedNext : "/";
    const savedKey = "geo-admin-login";
    const form = document.getElementById("f");
    const remember = document.getElementById("remember");
    try {
      const saved = JSON.parse(localStorage.getItem(savedKey) || "null");
      if (saved && saved.user) {
        form.user.value = saved.user;
        form.password.value = saved.password || "";
        remember.checked = true;
      }
    } catch (e) {}
    form.onsubmit = async (e) => {
      e.preventDefault();
      const fd = new FormData(e.target);
      const err = document.getElementById("err");
      err.textContent = "";
      try {
        const r = await fetch("/api/admin/login", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ user: fd.get("user"), password: fd.get("password") }),
        });
        const data = await r.json();
        if (!r.ok) throw new Error(data.detail || "登录失败");
        if (remember.checked) {
          localStorage.setItem(savedKey, JSON.stringify({ user: fd.get("user"), password: fd.get("password") }));
        } else {
          localStorage.removeItem(savedKey);
        }
        location.href = next;
      } catch (ex) {
        err.textContent = ex.message;
      }
    };
  </script>
</body>
</html>
