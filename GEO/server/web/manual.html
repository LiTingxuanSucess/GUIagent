<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>GEO 人工接管</title>
<style>
:root{color-scheme:dark;font:15px/1.65 -apple-system,BlinkMacSystemFont,"PingFang SC",sans-serif;background:#0e141b;color:#e7eef6}body{max-width:1140px;margin:auto;padding:28px 22px}a{color:#8ac5ff;text-decoration:none}header{display:flex;justify-content:space-between;align-items:center;gap:20px;flex-wrap:wrap}h1{font-size:25px;margin:0}h2{font-size:19px}p{color:#aebed0}section,.task{background:#18222f;border:1px solid #304154;border-radius:12px;padding:20px;margin:18px 0}textarea{box-sizing:border-box;width:100%;min-height:105px;background:#101922;border:1px solid #45586d;border-radius:8px;padding:12px;color:inherit;font:inherit}button{font:inherit;border:1px solid #4f7095;border-radius:7px;padding:7px 13px;background:#244e78;color:#fff;cursor:pointer}button.secondary{background:#263342}button.danger{background:#613a3f;border-color:#92555d}button:disabled{opacity:.45;cursor:default}.actions,.sites{display:flex;gap:10px;flex-wrap:wrap;margin-top:14px}.sites label{padding:4px 10px;background:#253342;border-radius:5px}.taskhead{display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap}.meta{color:#96abc1;font-size:13px}.badge{display:inline-block;background:#674d22;color:#ffe1a0;border-radius:20px;padding:2px 11px}.good{background:#1c5143;color:#a9f2d8}.prompt{white-space:pre-wrap;overflow-wrap:anywhere;background:#101922;border-radius:7px;padding:12px;margin:12px 0;max-height:200px;overflow:auto}.reason{color:#f1cc8c}#notice{white-space:pre-wrap;color:#f1cc8c;min-height:25px}.empty{color:#96abc1;text-align:center;padding:24px}details{border-top:1px solid #304154;padding:12px 0}.answer{white-space:pre-wrap;overflow-wrap:anywhere;max-height:480px;overflow:auto}small{color:#aebed0}nav{display:flex;gap:18px}input{accent-color:#70b4ff}
.sampling-head{display:flex;justify-content:space-between;gap:16px;align-items:start;flex-wrap:wrap}.sampling-head h2{margin:0}.sampling-note{margin:8px 0 18px}.sampling-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}.sampling-stat{padding:15px;background:#101922;border-radius:9px;min-width:0}.sampling-stat strong{display:block;font-size:25px;font-variant-numeric:tabular-nums;line-height:1.4;margin:7px 0}.sampling-stat small{display:block}.sampling-stat progress{width:100%;height:8px;accent-color:#7abcf9}.rounds{display:flex;flex-wrap:wrap;gap:9px;margin:18px 0}.round-step{padding:7px 12px;border:1px solid #304154;border-radius:7px;color:#96abc1;font-size:13px}.round-step.current{border-color:#77b7f5;color:#c2e1ff;background:#203a51}.round-step.done{color:#a9f2d8;border-color:#36675a}.sampling-table-wrap{overflow-x:auto}.sampling-table{border-collapse:collapse;width:100%;min-width:550px;text-align:left;font-size:14px}.sampling-table th,.sampling-table td{padding:10px 12px;border-bottom:1px solid #304154;vertical-align:top}.sampling-table th{color:#96abc1;font-size:13px;font-weight:500}.sampling-table td:first-child{font-weight:600}.sampling-table progress{width:80px;height:6px;margin-left:8px;accent-color:#70c9ac}.blockers{margin-top:18px}.blocker{border-left:3px solid #b48a44;background:#101922;border-radius:0 7px 7px 0;padding:11px 14px;margin-top:9px;overflow-wrap:anywhere}.blocker p{margin:3px 0;font-size:14px}.blocker a{font-size:13px}.sampling-foot{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-top:15px}.sampling-error{color:#f1cc8c;margin-top:10px}.sampling-id{overflow-wrap:anywhere}.sampling-table .muted{color:#96abc1}.sampling-head .badge{white-space:nowrap}@media(max-width:700px){body{padding:18px 12px}section,.task{padding:15px}.sampling-grid{grid-template-columns:repeat(2,minmax(0,1fr))}.sampling-stat strong{font-size:22px}.sampling-table th,.sampling-table td{padding:9px 7px}}
</style></head><body>
<header><h1>人工接管与回答采集</h1><nav><a href="/admin">号池管理</a><a href="/admin/monitor">运行看板</a><a href="/">任务控制台</a></nav></header>
<p>自动提问遇到异常后，保留原 Chrome 页面。请在这台 Mac 的浏览器中完成处理，再交回代码继续采集。</p>
<section id="sampling" aria-label="Excel 采样进度"><h2>Excel 采样进度</h2><div class="meta">正在读取采样批次…</div></section>
<section><h2>提交问题</h2><form id="ask"><textarea id="question" required maxlength="20000" placeholder="输入需要在平台上提交的问题"></textarea><div class="sites" id="sites"></div><div class="actions"><button id="submit">开始网页任务</button><small id="mode"></small></div></form></section>
<div id="notice" role="status" aria-live="polite"></div>
<h2>当前任务</h2><div id="tasks" aria-live="polite"></div>
<section><h2>最近任务与结果</h2><div id="history"></div></section>
<script>
const names={deepseek:'DeepSeek',doubao:'豆包',wenxinyiyan:'文心一言',yuanbao:'腾讯元宝',qianwen:'通义千问',kimi:'Kimi'};
const labels={queued:'等待账号',automatic:'自动提问与采集',waiting_manual:'等待人工',operator_active:'人工处理中',resume_queued:'等待恢复',collecting:'复核并采集回答',completed:'已完成',succeeded:'已完成',running:'执行中',cancelled:'已取消'};
const sends={before_send:'尚未确认提交',sending:'提交结果待确认',sent:'问题已提交'};
const samplingErrors={platform_busy:'平台繁忙，等待刷新重试',platform_risk_control:'需要安全验证',generation_timeout:'回答生成超时',manual_question_mismatch:'页面或问题已变化，需要核对原对话',manual_send_unconfirmed:'提交结果尚未确认',site_request_failed:'网页执行中断，需要核对原页面',platform_quota:'平台额度或账号限制',service_interrupted:'服务重启后待确认',cli_billing_required:'Cursor 账单未支付，辅助暂不可用',cli_auth_failed:'Cursor 登录失效',cli_timeout:'Cursor 辅助超时',cli_no_output:'Cursor 未返回有效进展',cli_verification_failed:'Cursor 辅助后页面复核未通过',no_progress:'页面恢复没有进展',missing_answer:'缺少正文',missing_search_sources:'缺少确认的搜索来源',missing_verified_share:'缺少已验证的分享链接',not_web_answer:'尚未取得网页回答'};
let snapshot={tasks:[],jobs:[]},busy=false,loading=false;
const expanded=new Map();
const openNotices=new Map();
const $=id=>document.getElementById(id),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
$('sites').innerHTML=Object.entries(names).map(([id,name])=>`<label><input type="checkbox" name="site" value="${id}" checked> ${name}</label>`).join('');
async function api(path,body){const r=await fetch(path,{method:body?'POST':'GET',headers:body?{'Content-Type':'application/json'}:{},body:body?JSON.stringify(body):undefined});if(r.status===401){location.href='/admin/login?next=%2Fadmin%2Fmanual';throw Error('需要重新登录')}const data=await r.json();if(!r.ok)throw Error(data.detail||'操作失败');return data}
function renderSampling(){
 const p=snapshot.sampling;
 if(!p?.available){$('sampling').innerHTML=`<h2>Excel 采样进度</h2><p class="meta">${esc(p?.message||'采样进度暂不可用，请稍后刷新')}</p>`;return}
 const n=v=>Math.max(0,Number(v)||0),sum=c=>Object.values(c||{}).reduce((a,b)=>a+n(b),0),pct=(a,b)=>b?Math.min(100,a/b*100):0;
 const c=p.counts||{},roundKeys=Object.keys(p.by_round||{}).sort((a,b)=>Number(a)-Number(b));
 const rkey=p.current_round==null?roundKeys[roundKeys.length-1]:String(p.current_round),r=p.by_round?.[rkey]||{total:0,counts:{}};
 const roundDone=n(r.counts?.complete),roundTotal=n(r.total),done=n(c.complete),total=n(p.total);
 const stale=!!p.read_error||!Number.isFinite(Date.parse(p.updated_at))||Date.now()-Date.parse(p.updated_at)>120000;
 const state=stale?'进度待更新':p.status==='completed'?'全部完成':p.status==='waiting_manual'?'等待处理':p.status==='needs_review'?'需要补齐结果':'采样进行中';
 const active=p.active_samples||[],gaps=p.quality_gaps||[];
 const rounds=roundKeys.map(key=>{const x=p.by_round[key],completed=n(x.counts?.complete),finished=completed===n(x.total)&&n(x.total)>0;return `<div class="round-step ${finished?'done':key===rkey?'current':''}">第 ${esc(key)} 遍 · ${completed}/${n(x.total)}${finished?' ✓':''}</div>`}).join('');
 const platformRows=Object.entries(p.by_site||{}).map(([site,counts])=>{
   const live=active.find(x=>x.site===site),current=p.current_round_by_site?.[site]||{},siteTotal=sum(counts),currentTotal=sum(current);
   let activity=live?(live.status==='waiting_manual'?'等待人工':live.status==='queued'||live.status==='submitted'?'排队 / 等待重试':'执行中')+(live.question_id?' · '+live.question_id:''):n(counts.retry_wait)?'等待重试':n(counts.incomplete)?'有结果缺项':n(counts.complete)===siteTotal?'已完成':'等待本轮调度';
   if(!live&&n(counts.share_pending))activity='保留原答案，待补验分享 '+n(counts.share_pending)+' 条';
   if(!live&&n(counts.needs_clarification))activity='需补充信息 '+n(counts.needs_clarification)+' 条，保留答复，不重复提问';
   const prefix=p.round_policy==='per_site'&&p.site_rounds?.[site]!=null?'第 '+n(p.site_rounds[site])+' 遍 · ':'';
   const currentText=prefix+(currentTotal?`${n(current.complete)}/${currentTotal}`:p.status==='completed'?`${siteTotal/Math.max(1,roundKeys.length)}/${siteTotal/Math.max(1,roundKeys.length)}`:'—');
   return `<tr><td>${esc(names[site]||site)}</td><td>${currentText}${currentTotal?`<progress max="${currentTotal}" value="${n(current.complete)}" aria-label="${esc(names[site]||site)}本轮进度"></progress>`:''}</td><td>${n(counts.complete)}/${siteTotal}</td><td class="${live?.status==='waiting_manual'?'reason':'muted'}">${esc(activity)}</td></tr>`;
 }).join('');
 const blocked=active.filter(x=>x.status==='waiting_manual'||x.status==='queued'&&x.auto_retry_at);
 const items=blocked.map(x=>{const t=snapshot.tasks.find(t=>t.job_id===x.job_id&&t.site===x.site)||{},code=x.error_code||t.error_code;
   const reason=samplingErrors[code]||x.reason||t.reason||'请检查原页面';
   const assist=x.assist_error_code?samplingErrors[x.assist_error_code]||x.assist_error_code:x.assist_status==='running'?'Cursor 正在辅助处理':x.assist_status==='failed'?'Cursor 辅助未通过':'';
   return `<div class="blocker"><strong>${esc(names[x.site]||x.site)} · ${esc(x.question_id)} · 第 ${n(x.round)} 遍</strong><p>${esc(reason)}${assist?'；'+esc(assist):''}</p><div class="meta">${esc(sends[x.send_state]||'')} ${x.status==='queued'&&x.auto_retry_at?'· 下次重试 '+esc(new Date(x.auto_retry_at).toLocaleTimeString('zh-CN',{hour12:false})):''}</div>${t.job_id?`<a href="#task-${esc(x.job_id)}-${esc(x.site)}">查看待办与处理操作 ↓</a>`:''}</div>`;
 }).concat(gaps.map(x=>`<div class="blocker"><strong>${esc(names[x.site]||x.site)} · ${esc(x.question_id)} · 第 ${n(x.round)} 遍</strong><p>${esc((x.quality_issues||[]).map(v=>samplingErrors[v]||v).join('、')||'结果待核对')}；${x.status==='retry_wait'?'等待重试':'未计入完成'}</p></div>`));
 $('sampling').innerHTML=`<div class="sampling-head"><div><h2>Excel 采样进度</h2><div class="meta sampling-id">${esc(p.batch_id)}</div></div><div class="actions" style="margin-top:0;align-items:center"><span class="badge ${!stale&&(p.status==='running'||p.status==='completed')?'good':''}">${state}</span><button type="button" id="export-sampling">导出当前结果（Excel）</button></div></div>
 <p class="sampling-note">${p.round_policy==='per_site'?'各平台按自己的100题独立推进轮次，其他平台待办不阻塞本平台。':'先完成本轮100题在六个平台的采样，再进入下一遍。'}正文、搜索来源和已验证的分享链接齐全才计为合格。${p.allow_clarification_advance?'需补充信息的澄清答复单列为已处理异常，可推进轮次，不计合格数。':''}</p>
 <div class="sampling-grid">
 <div class="sampling-stat"><small>${p.current_round==null?'最后一遍已完成':'当前第 '+n(p.current_round)+' 遍'}</small><strong>${roundDone} <span class="meta">/ ${roundTotal}</span></strong><progress value="${roundDone}" max="${roundTotal||1}" aria-label="本轮完成进度"></progress><small>${pct(roundDone,roundTotal).toFixed(1)}% · 平台采样次数</small></div>
 <div class="sampling-stat"><small>全部 ${roundKeys.length||5} 遍累计</small><strong>${done} <span class="meta">/ ${total}</span></strong><progress value="${done}" max="${total||1}" aria-label="全部轮次完成进度"></progress><small>${pct(done,total).toFixed(1)}% · 平台采样次数</small></div>
 <div class="sampling-stat"><small>正在执行</small><strong>${n(c.running)} <span class="meta">/ ${n(p.concurrency)}</span></strong><small>最多 ${n(p.concurrency)} 路并发</small><small>排队 ${n(c.submitted)} · 等待重试 ${n(c.retry_wait)}</small></div>
 <div class="sampling-stat"><small>需要处理</small><strong>${n(c.waiting_manual)+n(c.incomplete)+n(c.share_pending)+n(c.needs_clarification)}</strong><small>待人工 ${n(c.waiting_manual)} · 缺项 ${n(c.incomplete)} · 待补分享 ${n(c.share_pending)} · 需补充信息 ${n(c.needs_clarification)}</small><small>卡住的平台不影响其他平台</small></div></div>
 <div class="rounds" aria-label="各轮次进度">${rounds}</div>
 <div class="sampling-table-wrap"><table class="sampling-table"><thead><tr><th scope="col">平台</th><th scope="col">本轮完成</th><th scope="col">全部轮次累计</th><th scope="col">当前情况</th></tr></thead><tbody>${platformRows}</tbody></table></div>
 ${items.length?`<div class="blockers"><strong>卡点与缺项</strong>${items.join('')}${n(p.quality_gap_count)>gaps.length?`<p class="meta">另有 ${n(p.quality_gap_count)-gaps.length} 项结果缺项，完整记录见采样结果表。</p>`:''}</div>`:''}
 <div class="sampling-foot meta"><span>每 3 秒自动刷新 · 导出包含回答正文、搜索来源、分享链接及未完成状态</span><span>数据更新：${esc(new Date(p.updated_at).toLocaleString('zh-CN',{hour12:false}))}</span></div>
 <div id="sampling-error" class="sampling-error" role="status">${p.read_error?'读取失败，保留上次进度：'+esc(p.read_error):stale?'进度已超过 2 分钟未更新，请检查采样任务是否暂停。':''}</div>`;
}
function render(){
 renderSampling();
 $('mode').textContent=snapshot.enabled?'真实 Chrome → 人工处理 → 原回答采集':'人工工作流尚未启用，请先配置服务';$('submit').disabled=!snapshot.enabled||busy;
 $('tasks').innerHTML=snapshot.tasks.length?snapshot.tasks.map((t,i)=>{const waiting=['waiting_manual','operator_active'].includes(t.status);const expired=t.expires_at&&Date.parse(t.expires_at)<Date.now();return `<article class="task"><div class="taskhead"><strong>${esc(names[t.site]||t.site)} · ${esc(t.account_label||'尚未分配账号')}</strong><span class="badge">${esc(labels[t.status]||t.status)}</span></div><div class="meta">任务 ${esc(t.job_id)} · ${esc(sends[t.send_state]||'等待页面确认')}${expired?' · 已超过预计处理时间，仍保留原任务':''}</div><div class="prompt">${esc(t.prompt)}</div>${t.reason?`<div class="reason">${esc(t.reason)}</div>`:''}<div class="actions"><button class="secondary" data-i="${i}" data-action="copy">复制问题</button>${waiting?`<button data-i="${i}" data-action="claim" ${t.status==='operator_active'?'disabled':''}>人工接管</button><button class="secondary" data-i="${i}" data-action="open" ${!t.account_id?'disabled':''}>在 Mac 打开原页面</button><button data-i="${i}" data-action="continue">已完成验证，继续执行</button><button data-i="${i}" data-action="submitted">已手动提交，开始采集</button>`:''}<button class="danger" data-i="${i}" data-action="cancel">取消整个任务</button></div>${waiting?'<small>处理时保留原对话。问题已提交时直接完成验证；提交结果待确认时先核对页面。代码会再次检查问题与回答是否对应。</small>':''}</article>`}).join(''):'<div class="empty">暂无待处理任务</div>';
 $('history').innerHTML=snapshot.jobs.length?snapshot.jobs.map((j,i)=>`<details data-job="${esc(j.job_id)}" ${(expanded.has(j.job_id)?expanded.get(j.job_id):i===0||j.status!=='succeeded')?'open':''}><summary>${esc(j.prompt.slice(0,65))} · ${esc(labels[j.status]||j.status)} · ${j.completed_sites}/${j.sites.length}</summary><div class="meta">${esc(j.job_id)}</div>${(j.results||[]).map(r=>`<h3>${esc(names[r.site_id]||r.site_id)} · ${r.human_assisted?'人工协助后采集':'自动采集'}</h3><div class="answer">${esc(r.answer||'')}</div><small>引用 ${(r.citations||[]).length} 条 · ${esc(r.submission_mode==='manual'?'人工提交':'代码提交')}</small>`).join('')}</details>`).join(''):'<div class="empty">尚无任务</div>';
 $('tasks').querySelectorAll('.task').forEach((node,i)=>{const task=snapshot.tasks[i];node.id='task-'+task.job_id+'-'+task.site;
   const open=node.querySelector('[data-action="open"]');if(open){const fresh=document.createElement('button');fresh.className='secondary';fresh.textContent='新建平台标签页';fresh.dataset.i=i;fresh.dataset.action='new-tab';fresh.disabled=!task.account_id;fresh.title='在原账号的 Chrome 新开平台页面，保留本题和发送记录';open.after(fresh)}
   const status=document.createElement('div');status.className='reason open-status';status.setAttribute('role','status');status.textContent=openNotices.get(task.job_id+'/'+task.site)||'';node.querySelector('.actions').after(status);
   if(snapshot.auto_recovery_enabled&&task.status==='waiting_manual'&&task.auto_recovery_at&&(task.auto_recovery_attempts||0)<3&&['platform_risk_control','platform_auth_unavailable','platform_setting_unavailable','recovery_unconfirmed','generation_timeout','service_interrupted','manual_send_unconfirmed','manual_question_mismatch','browser_unresponsive'].includes(task.error_code)){
     node.querySelector('.badge').textContent='等待自动复核';
     const notice=document.createElement('div');notice.className='meta';notice.textContent='预计 '+new Date(task.auto_recovery_at).toLocaleTimeString('zh-CN',{hour12:false})+' 自动核对原问题并续采；已复核 '+(task.auto_recovery_attempts||0)+' / 3 次';node.append(notice);
   }
   if(['waiting_manual','operator_active'].includes(task.status)&&task.send_state==='sent'&&task.error_code==='manual_question_mismatch'){
     const restore=document.createElement('button');restore.textContent='恢复原对话并采集';restore.dataset.i=i;restore.dataset.action='restore';
     node.querySelector('.actions').append(restore);
   }
   if(['waiting_manual','operator_active'].includes(task.status)&&['sent','sending'].includes(task.send_state)){
     const collect=document.createElement('button');collect.textContent='采集当前已提交的本题';collect.dataset.i=i;collect.dataset.action='confirm-current';
     node.querySelector('.actions').append(collect);
   }
 });
}
$('history').addEventListener('toggle',e=>{if(e.target.matches('details[data-job]'))expanded.set(e.target.dataset.job,e.target.open)},true);
let exporting=false;
$('sampling').addEventListener('click',async e=>{if(!e.target.closest('#export-sampling')||exporting)return;exporting=true;const button=e.target.closest('button');button.disabled=true;button.textContent='正在导出…';try{const r=await fetch('/api/admin/sampling/export');if(r.status===401){location.href='/admin/login?next=%2Fadmin%2Fmanual';throw Error('需要重新登录')}if(!r.ok){const data=await r.json();throw Error(data.detail||'导出失败')}const blob=await r.blob(),url=URL.createObjectURL(blob),link=document.createElement('a'),name=/filename\*=utf-8''([^;]+)/i.exec(r.headers.get('Content-Disposition')||'');link.href=url;link.download=name?decodeURIComponent(name[1]):'GEO采样结果.xlsx';document.body.append(link);link.click();link.remove();setTimeout(()=>URL.revokeObjectURL(url),60000);$('notice').textContent='已导出当前采样结果，未完成项保留实际状态。'}catch(error){$('notice').textContent=error.message}finally{exporting=false;const current=$('export-sampling');if(current){current.disabled=false;current.textContent='导出当前结果（Excel）'}}});
async function load(){if(busy||loading)return;loading=true;try{const next=await api('/api/admin/manual-tasks');if(!next.sampling?.available&&snapshot.sampling?.available)next.sampling={...snapshot.sampling,read_error:next.sampling?.message||'采样进度暂不可读'};snapshot=next;render()}catch(e){$('notice').textContent=e.message;const warning=$('sampling-error');if(warning)warning.textContent='刷新失败，当前显示的是上次读取的进度：'+e.message}finally{loading=false}}
$('ask').onsubmit=async e=>{e.preventDefault();if(busy)return;const sites=[...document.querySelectorAll('input[name=site]:checked')].map(e=>e.value);if(!sites.length){$('notice').textContent='请至少选择一个平台';return}busy=true;render();try{const j=await api('/api/v1/ask',{prompt:$('question').value,sites,request_id:crypto.randomUUID()});$('notice').textContent='任务已提交：'+j.job_id}catch(e){$('notice').textContent=e.message+'；若结果不明，请先查看任务列表，避免重复提交。'}finally{busy=false;await load()}};
$('tasks').onclick=async e=>{const b=e.target.closest('button[data-action]');if(!b||busy)return;const t=snapshot.tasks[Number(b.dataset.i)],action=b.dataset.action,key=t.job_id+'/'+t.site;
 const pageAction=action==='open'||action==='new-tab';
 const openStatus=message=>{openNotices.set(key,message);const status=b.closest('.task')?.querySelector('.open-status');if(status)status.textContent=message};
 if(action==='copy'){try{await navigator.clipboard.writeText(t.prompt);$('notice').textContent='问题已复制'}catch{const field=document.createElement('textarea');field.value=t.prompt;document.body.append(field);field.select();document.execCommand('copy');field.remove();$('notice').textContent='问题已复制'}return}
 if(action==='cancel'&&!confirm('取消整个任务？已经提交到平台的问题和回答会保留在 Chrome 中。'))return;
 busy=true;b.disabled=true;if(pageAction){b.textContent=action==='new-tab'?'正在新建…':'正在打开…';openStatus(action==='new-tab'?'正在原账号的 Chrome 中新建平台标签页…':'正在定位原账号的 Chrome 页面…')}
 try{let result;if(action==='cancel')result=await api('/api/v1/jobs/'+encodeURIComponent(t.job_id)+'/cancel',{});else result=await api('/api/admin/manual-tasks/'+encodeURIComponent(t.job_id)+'/'+encodeURIComponent(t.site),{action,revision:t.revision});
 const message=action==='new-tab'?'已在原账号的 Chrome 新建平台标签页。'+(['sent','sending'].includes(t.send_state)?'请从历史记录打开本题，再点击“采集当前已提交的本题”。':'完成登录后，点击“已完成验证，继续执行”。'):action==='open'?(result.manual_states?.[t.site]?.target_id!==t.target_id?'已恢复保存的原对话，并切到服务器 Mac 的 Chrome 前台。':'已切到服务器 Mac 的 Chrome 原页面。'):action==='claim'?'已进入人工处理，账号浏览器的自动操作暂停':'操作已接收，正在核对页面状态';
 $('notice').textContent=message;if(pageAction)openStatus(message)
 }catch(e){const message=e.message+(pageAction?'':'；请刷新状态后再决定下一步。');$('notice').textContent=message;if(pageAction)openStatus(message)}finally{busy=false;await load()}};
load();setInterval(load,3000);
</script></body></html>
